services:
  sprecorder:
    build:
      context: .
      platforms:
        - linux/amd64
    image: sprecorder:robust
    container_name: sprecorder
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      SPREC_HOST: 0.0.0.0
      SPREC_PORT: "8080"
      SPREC_BACKEND: http://127.0.0.1:3030
      SPREC_DATA_DIR: /data
      SPREC_RECORDING_START_TIMEOUT: "30"
      SPREC_FFMPEG_STALL_TIMEOUT: "45"
      SPREC_FFMPEG_RECONNECT_DELAY: "5"
      SPREC_FFMPEG_MAX_RECONNECTS: "0"
      SPREC_OFFLINE_CONFIRMATIONS: "3"
      SPREC_OFFLINE_NO_GROWTH_SECONDS: "15"
      SPREC_CONVERT_TIMEOUT: "14400"
    ports:
      - "8080:8080"
      - "3030:3030"
    volumes:
      - /mnt/services/SPRECORDER:/data

services:
  sprecorder-standalone:
    build:
      context: .
      dockerfile: Dockerfile
      platforms: [linux/amd64]
    image: sprecorder:2.2.0-standalone
    container_name: sprecorder-standalone-220
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      SPREC_HOST: 0.0.0.0
      SPREC_PORT: "8080"
      SPREC_BACKEND: http://127.0.0.1:13031
      SPREC_RELAY_PORT: "13031"
      SPREC_DATA_DIR: /data
      SPREC_RECORDING_START_TIMEOUT: "30"
      SPREC_FFMPEG_STALL_TIMEOUT: "45"
      SPREC_FFMPEG_RECONNECT_DELAY: "5"
      SPREC_FFMPEG_MAX_RECONNECTS: "0"
    ports:
      - "18081:8080"
      - "13031:13031"
    volumes:
      - /mnt/services/SPRECORDER/config-standalone-2.2:/data/config
      - /mnt/services/SPRECORDER/recordings:/data/recordings
      - /mnt/services/SPRECORDER/logs-standalone-2.2:/data/logs

services:
  sprecorder:
    container_name: sprecorder
    image: ghcr.io/salides/sprecorder:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      SPREC_HOST: 0.0.0.0
      SPREC_PORT: "8080"
      SPREC_BACKEND: http://127.0.0.1:3030
      SPREC_DATA_DIR: /data
      SPREC_RECORDING_START_TIMEOUT: "30"
      SPREC_FFMPEG_STALL_TIMEOUT: "45"
      SPREC_FFMPEG_RECONNECT_DELAY: "5"
      SPREC_FFMPEG_MAX_RECONNECTS: "0"
      SPREC_SIZE_WATCH_SECONDS: "600"
      SPREC_SIZE_WATCH_POLL_SECONDS: "30"
    ports:
      - "8080:8080"
      - "3030:3030"
    volumes:
      - /mnt/services/SPRECORDER:/data
